networks:
  home-network:
    driver: bridge

services:
  # ---------------------------------------------------------------------------
  # Nginx Proxy Manager (Reverse Proxy + SSL)
  # ---------------------------------------------------------------------------
  npm:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: npm
    restart: unless-stopped
    ports:
      - '80:80'
      - '81:81'   # Painel Web do NPM
      - '443:443'
    environment:
      TZ: ${TZ}
    volumes:
      - ${DATA_DIR}/nginx-proxy-manager/data:/data
      - ${DATA_DIR}/nginx-proxy-manager/letsencrypt:/etc/letsencrypt
    networks:
      - home-network

  # ---------------------------------------------------------------------------
  # Portainer (Gerenciador de Docker)
  # ---------------------------------------------------------------------------
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - '9000:9000'
      - '9443:9443'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DATA_DIR}/portainer/data:/data
    networks:
      - home-network

  # ---------------------------------------------------------------------------
  # VS Code Web (Code-Server)
  # ---------------------------------------------------------------------------
  vscode:
    image: lscr.io/linuxserver/code-server:latest
    container_name: vscode
    restart: unless-stopped
    ports:
      - '8441:8443'   # Exposto em 8441 no host para liberar a 8443 para o Crafty
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      DEFAULT_WORKSPACE: /config/workspace
    volumes:
      - ${DATA_DIR}/vscode/config:/config
    networks:
      - home-network

  # ---------------------------------------------------------------------------
  # Jellyfin (Media Server)
  # ---------------------------------------------------------------------------
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    ports:
      - '8096:8096'
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ${DATA_DIR}/jellyfin/config:/config
      - ${MEDIA_DIR}:/media
    networks:
      - home-network

  # ---------------------------------------------------------------------------
  # Crafty Controller (Gerenciador de Servidores Minecraft)
  # ---------------------------------------------------------------------------
  crafty:
    image: registry.gitlab.com/crafty-controller/crafty-4:latest
    container_name: crafty
    restart: unless-stopped
    ports:
      - '8443:8443'         # Mantido 8443 no host
      - '8123:8123'         # Porta de API/HTTP
      - '25565-25575:25565-25575/tcp' # Range Java
      - '19132-19135:19132-19135/udp' # Range Bedrock
      - '8124:8124/tcp'     # Dynmap / BlueMap
    environment:
      TZ: ${TZ}
    volumes:
      - ${DATA_DIR}/crafty/data:/crafty/crafty-web/app/config
      - ${DATA_DIR}/crafty/servers:/crafty/crafty-web/app/game_servers
    networks:
      - home-network

  # ---------------------------------------------------------------------------
  # Filebrowser (Gestor de Arquivos Web)
  # ---------------------------------------------------------------------------
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    restart: unless-stopped
    ports:
      - '8080:8080'
    user: "${PUID}:${PGID}"
    volumes:
      - /:/srv
      - ${DATA_DIR}/filebrowser/filebrowser.db:/database/filebrowser.db
      - ${DATA_DIR}/filebrowser/config:/config
    networks:
      - home-network

  # ---------------------------------------------------------------------------
  # Syncthing (Sincronização Contínua de Arquivos)
  # ---------------------------------------------------------------------------
  syncthing:
    image: lscr.io/linuxserver/syncthing:latest
    container_name: syncthing
    restart: unless-stopped
    ports:
      - '8384:8384'       # Interface Web GUI
      - '22000:22000/tcp' # Transferência TCP
      - '22000:22000/udp' # Transferência UDP
      - '21027:21027/udp' # Local Discovery
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ${DATA_DIR}/syncthing/config:/config
      - /:/data/host
    networks:
      - home-network

  # ---------------------------------------------------------------------------
  # Uptime Kuma (Monitorização de Serviços)
  # ---------------------------------------------------------------------------
  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      - '3001:3001'
    volumes:
      - ${DATA_DIR}/uptime-kuma/data:/app/data
    networks:
      - home-network

  # ---------------------------------------------------------------------------
  # qBittorrent (Cliente Torrent)
  # ---------------------------------------------------------------------------
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    ports:
      - '8085:8085'       # Interface Web GUI
      - '6881:6881/tcp'   # Entrada Torrent TCP
      - '6881:6881/udp'   # Entrada Torrent UDP
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      WEBUI_PORT: 8085
    volumes:
      - ${DATA_DIR}/qbittorrent/config:/config
      - ${MEDIA_DIR}:/downloads
    networks:
      - home-network
